# Varredura de segurança contínua.
#
# Existe porque "rodamos npm audit uma vez" não é controle: dependência
# vulnerável aparece quando alguém publica o aviso, não quando a gente mexe
# no código. Rodar semanalmente pega o que surge sozinho.
#
# Hoje a árvore está limpa (zero vulnerabilidade). O build falha só em
# vulnerabilidade crítica, de propósito: quando uma nova alta aparecer num
# aviso publicado, sem correção pronta, falhar aqui todo dia por algo que a
# gente ainda não pode consertar ensina o time a ignorar o alerta, que é o
# pior resultado possível. O resumo abaixo mostra a contagem por severidade.

name: seguranca

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 9 * * 1'   # segunda de manhã
  workflow_dispatch:

jobs:
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: instalar
        working-directory: auditeste-a11y
        run: npm ci --omit=dev --ignore-scripts
      - name: varredura
        working-directory: auditeste-a11y
        continue-on-error: true
        run: npm audit
      - name: resumo
        working-directory: auditeste-a11y
        run: |
          npm audit --json > /tmp/audit.json || true
          node -e "
            const d = require('/tmp/audit.json');
            const v = d.vulnerabilities || {};
            const c = { critical: 0, high: 0, moderate: 0, low: 0 };
            for (const k of Object.keys(v)) c[v[k].severity] = (c[v[k].severity] || 0) + 1;
            console.log('criticas: ' + c.critical + ' · altas: ' + c.high
              + ' · medias: ' + c.moderate + ' · baixas: ' + c.low);
            if (c.critical > 0) {
              console.log('');
              console.log('Vulnerabilidade CRITICA. Esta e a que nao espera a proxima sprint.');
              process.exit(1);
            }
          "

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: procurar segredo na historia
        run: |
          # Padrões que já apareceram neste projeto, mais os genéricos.
          # nvapi-sua-chave-aqui é o exemplo do .env.example e não conta.
          achados=$(git log --all -p \
            | grep -oE "nvapi-[A-Za-z0-9_-]{12,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----" \
            | grep -v "nvapi-sua-chave-aqui" | sort -u || true)
          if [ -n "$achados" ]; then
            echo "SEGREDO na história do git:"
            echo "$achados" | sed 's/\(.\{12\}\).*/\1.../'
            exit 1
          fi
          echo "nenhum segredo na história"

  # Varredura dinâmica: ataca o sistema em execução, e não o código parado.
  #
  # Roda em duas frentes porque elas respondem a perguntas diferentes. A
  # local sobe um alvo limpo e pode atacar à vontade, inclusive gravando. A
  # de produção só faz o que não escreve nada, e existe porque metade das
  # falhas desta categoria é de configuração do ambiente, não de código:
  # cabeçalho que sumiu no deploy, HSTS que caiu, arquivo que passou a ser
  # servido. Nenhuma dessas o alvo local enxerga.
  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: instalar
        working-directory: auditeste-a11y
        run: npm ci --omit=dev --ignore-scripts
      - name: varredura contra alvo local
        working-directory: auditeste-a11y
        run: node dast.js
      - name: varredura contra o ambiente publicado
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: auditeste-a11y
        run: node dast.js https://audiprint.up.railway.app

  # Varredura por ferramenta INDEPENDENTE (OWASP ZAP), e nao pela nossa (dast.js).
  #
  # Existe pela mesma razao de um pentest de fora: teste que a gente escreve
  # convence um engenheiro, nao um cetico. O ZAP e ferramenta de mercado, aberta,
  # que o cliente conhece e pode rodar sozinho. O laudo fica guardado como
  # artefato do job, pronto para anexar num relatorio.
  #
  # Roda contra a producao (precisa do site no ar), entao so no agendamento
  # semanal e quando disparado a mao. Nao trava o build: e evidencia, e o freio
  # de release ja e o dast.js + os testes.
  zap_independente:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: OWASP ZAP baseline contra a producao
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://audiprint.up.railway.app'
          fail_action: false
          allow_issue_writing: false
          cmd_options: '-a'

  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: instalar
        working-directory: auditeste-a11y
        run: npm ci --omit=dev --ignore-scripts
      - name: testes que nao precisam de navegador
        working-directory: auditeste-a11y
        run: |
          node teste-cofre.js
          node teste-cifra.js
          node teste-backup.js
          node teste-privacidade.js
          node teste-docker.js
          node teste-seguranca.js
          node teste-injecao.js
          node teste-sso.js
          node teste-ssrf.js
          node teste-convite.js
          node teste-equipes.js
          node teste-provas.js
          node teste-cors-proprio.js
