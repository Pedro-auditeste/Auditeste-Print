# Railway — ponte auditeste-a11y (axe-core + Pa11y + Lighthouse).
#
# Variáveis no painel:
#   PONTE_TOKEN        obrigatório para habilitar scans
#   AGENTE_API_KEY     obrigatória para IA (descrever prints + Gherkin)
#   AGENTE_BASE_URL    opcional — padrão https://integrate.api.nvidia.com/v1
#   AGENTE_MODELO      opcional — padrão meta/llama-3.2-11b-vision-instruct
#   AGENTE_MODELO_FALLBACK  opcional — padrão meta/llama-3.2-11b-vision-instruct
#   PONTE_DOMINIOS     opcional — allowlist (ex: cliente.com.br)
#   PONTE_MAX          opcional — scans simultâneos (padrão 2)

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/ping"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
