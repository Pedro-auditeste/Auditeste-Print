# Railway — deploy da ponte auditeste-a11y (Docker + Playwright).
# Variáveis obrigatórias no painel:
#   PONTE_TOKEN        string longa e aleatória (habilita scans)
#   ANTHROPIC_API_KEY  opcional — cenários por IA
#   PONTE_DOMINIOS     opcional — allowlist de domínios

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/ping"
restartPolicyType = "ON_FAILURE"
