<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  body{width:300px;margin:0;padding:16px;font-family:'Segoe UI',system-ui,sans-serif;color:#1e2a30;}
  h1{font-size:.95rem;color:#0d3446;margin:0 0 2px;}
  p.sub{font-size:.75rem;color:#5b6b73;margin:0 0 14px;}
  .grupo{border-top:1px solid #e3e7e5;padding-top:12px;margin-top:12px;}
  .grupo:first-of-type{border-top:0;padding-top:0;margin-top:0;}
  .grupo h2{font-size:.78rem;color:#0d3446;margin:0 0 8px;}
  .acoes{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  button{
    width:100%;font:inherit;font-size:.8rem;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;border:none;border-radius:999px;padding:10px;
    background:#5ea32f;color:#fff;cursor:pointer;
  }
  button.sec{background:#0d3446;}
  button.perigo{background:#a32222;}
  button:hover:not(:disabled){background:#4d8827;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  #msg{font-size:.78rem;margin-top:12px;line-height:1.45;min-height:2.6em;}
  #msg.erro{color:#b23b3b;}
  #msg b{color:#0d3446;}
</style>
</head>
<body>
  <h1>Audi Print</h1>
  <p class="sub">Clique normalmente no site; a extensão guarda o ID e o par antes/depois.</p>
  <section class="grupo">
    <h2>Evidência manual</h2>
    <div class="acoes">
      <button id="iniciar">Iniciar</button>
      <button id="parar" class="sec">Parar</button>
      <button id="exportar" class="sec">Exportar JSON</button>
      <button id="limpar" class="perigo">Limpar</button>
    </div>
  </section>
  <section class="grupo">
    <h2>Acessibilidade</h2>
    <button id="analisar">Analisar esta página</button>
  </section>
  <div id="msg" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
